version: v0.3

listeners:
  - name: "http-8899"
    address: "0.0.0.0"
    port: 8899
    timeout: "300s"

providers:
  defaults:
    default_model: "MoM"
  models:
    - name: "MoM"
      provider_model_id: "qwen3.5:0.8b"
      backend_refs:
        - name: "primary"
          endpoint: "10.156.186.8:8080"
          protocol: "http"
          type: "openai"
          base_url: "http://10.156.186.8:8080/v1"
          provider: "openai"
          auth_header: "Authorization"
          auth_prefix: "Bearer"
          api_key: "sk-123456"
          extra_headers:
            Authorization: "Bearer sk-123456"
          weight: 100
    - name: "MoM-large"
      provider_model_id: "qwen3.5:122b"
      backend_refs:
        - name: "primary"
          endpoint: "10.156.186.8:8080"
          protocol: "http"
          type: "openai"
          base_url: "http://10.156.186.8:8080/v1"
          provider: "openai"
          auth_header: "Authorization"
          auth_prefix: "Bearer"
          api_key: "sk-123456"
          extra_headers:
            Authorization: "Bearer sk-123456"
          weight: 100

routing:
  modelCards:
    - name: "MoM"
      description: "Fast default text model"
      capabilities: ["chat", "reasoning"]
    - name: "MoM-large"
      description: "Higher quality model for complex reasoning requests"
      capabilities: ["chat", "reasoning", "long-context"]

  signals:
    complexity:
      - name: "needs_reasoning"
        threshold: 0.75
        match_mode: keyword_fallback_emb
        keyword_mapping_path: src/vllm-sr/complexity-assets/keyword_map.json
        description: "Escalate multi-step reasoning or synthesis-heavy prompts."
        hard:
          candidates:
            - solve this step by step
            - compare multiple tradeoffs
            - analyze the root cause
        easy:
          candidates:
            - answer briefly
            - quick summary
            - simple rewrite

  decisions:
    - name: "complexity_route"
      description: "Requests needing reasoning route to the stronger model."
      priority: 200
      rules:
        operator: AND
        conditions:
          - type: complexity
            name: "needs_reasoning"
      modelRefs:
        - model: MoM-large
          use_reasoning: true
      algorithm:
        type: static

    - name: "default_route"
      description: "Fallback for prompts not requiring complexity escalation."
      priority: 100
      rules:
        operator: AND
        conditions: []
      modelRefs:
        - model: MoM
          use_reasoning: false
      algorithm:
        type: static

global:
  model_catalog:
    embeddings:
      semantic:
        qwen3_model_path: models/mom-embedding-pro
        gemma_model_path: models/mom-embedding-flash
        mmbert_model_path: models/mom-embedding-ultra
        multimodal_model_path: models/mom-embedding-multimodal
        bert_model_path: models/mom-embedding-light
        use_cpu: true
        embedding_config:
          model_type: qwen3
          preload_embeddings: true
          target_dimension: 768
          target_layer: 22
          enable_soft_matching: true
          top_k: 1
          min_score_threshold: 0.45
  stores:
    semantic_cache:
      enabled: false
